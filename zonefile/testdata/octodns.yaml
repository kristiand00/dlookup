---
'':
  - type: A
    ttl: 300
    octodns:
      cloudflare:
        proxied: true
    values:
      - 192.0.2.1
      - 192.0.2.2
  - type: MX
    values:
      - exchange: mail.example.com.
        preference: 10
  - type: TXT
    value: v=spf1 -all
  - type: CAA
    value:
      flags: 0
      tag: issue
      value: letsencrypt.org
_dmarc:
  type: TXT
  value: v=DMARC1\; p=none
_sip._tcp:
  type: SRV
  value:
    port: 5060
    priority: 10
    target: sip.example.com.
    weight: 20
www:
  type: CNAME
  value: example.com.
